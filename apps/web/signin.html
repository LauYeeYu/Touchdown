<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f2ede2" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Touchdown</title>
    <!-- The site's preview for chat apps: the build adds the picture (scripts/site-preview.ts), the server its address and the line under the title (docs/33). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Touchdown" />
    <meta property="og:title" content="Touchdown" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the chosen theme before first paint. The Content Security Policy allows this one script by hash.
      try {
        var t = localStorage.getItem("td-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- The sign-in, invitation, reset and setup pages (docs/33). Built on their own, served without a session. -->
    <div id="root"></div>
    <script type="module" src="/src/signin/main.tsx"></script>
  </body>
</html>
