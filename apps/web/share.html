<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f2ede2" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <!-- A link's preview in a chat app says only where it comes from (docs/32, Q-SHARE-PREVIEW). -->
    <meta property="og:title" content="Shared from Touchdown" />
    <meta property="og:description" content="A flight, an aircraft or a log of flights and aircraft." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Shared from Touchdown</title>
    <link rel="stylesheet" href="/src/share/boot.css" />
    <script>
      // Apply the chosen theme before first paint. The Content Security Policy allows this one script by hash.
      try {
        var t = localStorage.getItem("td-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- One shared link's page (docs/32, "The public page"). Built on its own, served without a session. -->
    <div id="root">
      <!-- The app's loading screen until the page's code runs; share/main.tsx continues it. -->
      <div class="boot" aria-busy="true">
        <p class="boot__mark">Touchdown</p>
        <div class="boot__bar boot__bar--waiting" role="progressbar" aria-label="Opening the link">
          <span class="boot__ground"></span><span class="boot__runway"></span>
          <span class="boot__glide"><span class="boot__fill"></span><svg class="boot__plane" viewBox="0 0 48 15.8" aria-hidden="true"><path fill="currentColor" d="M1.2 7.2 3.8 6.5 2.6.6h2.8L12.4 6.6H28.6C30.6 6.6 31.6 5 33.8 5H42.2C45 5 47.4 7 47.7 9.2C47.9 10.3 46.9 10.9 45.4 11.05 44.8 11.1 44.4 11.1 44 11.1H31L29.4 11.5H20.6L19 11.1H12.6C9.6 11.1 5.6 9.2 1.2 7.6ZM1.6 7.1 8.6 7.2 9.6 7.9 2.4 8.1ZM18.8 9.35 30.6 10.55 25 11.35 17.6 9.85ZM25.6 11.6H30.2A1 1 0 0 1 30.2 13.6H25.6A1 1 0 0 1 25.6 11.6ZM27.4 10.8H29.4V11.8H27.4ZM19.4 10.9H23A.9.9 0 0 1 23 12.7H19.4A.9.9 0 0 1 19.4 10.9ZM20.6 10.3H22.4V11.1H20.6ZM23 11.2H23.7V14.2H23ZM42.2 11H42.85V14.3H42.2Z"/><circle fill="currentColor" cx="22.45" cy="14.85" r="0.95"/><circle fill="currentColor" cx="24.25" cy="14.85" r="0.95"/><circle fill="currentColor" cx="42.5" cy="14.95" r="0.85"/></svg></span>
        </div>
        <p class="boot__text">Opening the link…</p>
      </div>
    </div>
    <script type="module" src="/src/share/main.tsx"></script>
  </body>
</html>
